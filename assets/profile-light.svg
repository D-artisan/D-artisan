<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="400" viewBox="0 0 1000 400" role="img" aria-labelledby="title desc">
<title id="title">Daniel Nti-Boakye | Software and AI Engineer</title>
<desc id="desc">Ideas into systems. Systems people trust. Software, cloud and AI. A subtle animated signal moves through an abstract system of connected nodes, then settles.</desc>
<defs>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#2166c2"/><stop offset="1" stop-color="#7054c5"/></linearGradient>
  <radialGradient id="wash"><stop stop-color="#2166c2" stop-opacity=".13"/><stop offset="1" stop-color="#2166c2" stop-opacity="0"/></radialGradient>
</defs>
<style>
  text {font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;}
  .mono {font-family: ui-monospace, 'SFMono-Regular', Consolas, monospace;}
  .signal {stroke-dasharray: 12 680; animation: travel 3.6s ease-out 1;}
  .ring {transform-box:fill-box;transform-origin:center;animation: breathe 3.6s ease-out 1;}
  @keyframes travel {from {stroke-dashoffset:692;opacity:0;} 15% {opacity:1;} to {stroke-dashoffset:0;opacity:1;}}
  @keyframes breathe {0% {opacity:.25;transform:scale(.95);} 50% {opacity:.8;transform:scale(1.04);} 100% {opacity:1;transform:scale(1);}}
  @media (prefers-reduced-motion: reduce) {.signal,.ring {animation:none;}}
</style>
<rect x="1" y="1" width="998" height="398" rx="20" fill="#f6f8fc" stroke="#d4deed"/>
<circle cx="837" cy="190" r="230" fill="url(#wash)"/>
<path d="M40 63 H61" stroke="#2166c2" stroke-width="3"/>
<text x="73" y="69" font-size="16" letter-spacing="2.2" fill="#52647d" class="mono">DANIEL NTI-BOAKYE</text>
<text x="40" y="147" font-size="52" font-weight="700" letter-spacing="-2" fill="#17243b">Ideas into systems.</text>
<text x="40" y="211" font-size="52" font-weight="700" letter-spacing="-2" fill="url(#accent)">Systems people trust.</text>
<text x="42" y="261" font-size="20" fill="#52647d">Software engineer. AI builder. Problem solver.</text>
<path d="M40 304 H960" stroke="#d4deed"/>
<text x="42" y="352" font-size="14" letter-spacing="1.3" fill="#52647d" class="mono">SOFTWARE / CLOUD / AI</text>
<text x="958" y="352" text-anchor="end" font-size="14" fill="#52647d" class="mono">D-artisan</text>
<g fill="none" stroke="#d4deed" stroke-width="1.5">
  <rect class="ring" x="756" y="94" width="150" height="150" rx="32" transform="rotate(12 831 169)"/>
  <rect x="776" y="114" width="110" height="110" rx="25"/>
  <path d="M716 77 H800 Q831 77 831 108 V140 M853 169 H921 Q944 169 944 192 V267 M831 196 V253 Q831 277 807 277 H729"/>
</g>
<path class="signal" d="M716 77 H800 Q831 77 831 108 V140 M853 169 H921 Q944 169 944 192 V267 M831 196 V253 Q831 277 807 277 H729" fill="none" stroke="url(#accent)" stroke-width="2.5"/>
<rect x="807" y="145" width="48" height="48" rx="12" fill="#f6f8fc" stroke="url(#accent)" stroke-width="2"/>
<path d="m825 160 -8 9 8 9 m12 -18 8 9 -8 9" stroke="#2166c2" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
<g fill="#f6f8fc" stroke="#7054c5" stroke-width="2"><circle cx="716" cy="77" r="5"/><circle cx="944" cy="267" r="5"/><circle cx="729" cy="277" r="5"/></g>
</svg>